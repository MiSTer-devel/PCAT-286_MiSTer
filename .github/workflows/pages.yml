name: Publish web tools

# Publishes every SW/ROMs/*.html page to GitHub Pages as its own folder, e.g.
# SW/ROMs/BIOS_Builder.html -> https://spark2k06.github.io/PCAT-286_MiSTer/BIOS_Builder
on:
  push:
    branches: [main]
    paths:
      - SW/ROMs/*.html
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stage the site
        run: |
          mkdir _site
          for page in SW/ROMs/*.html; do
            name=$(basename "$page" .html)
            mkdir "_site/$name"
            cp "$page" "_site/$name/index.html"
          done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
